<style>
:root{
  --rx:10px;--tr:0.15s;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-size:16px;line-height:1.5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f5f7fb;color:#1f2937}
.hide{display:none!important}

.shell{min-height:100vh;background:#f1f5f9;padding-bottom:80px}
.shell-pc{min-height:100vh;background:#f1f5f9;display:flex}
.shell-pc aside{width:220px;background:#0f172a;color:#fff;min-height:100vh;flex-shrink:0}
.shell-pc main{flex:1;padding:20px}
.shell-pc .pcnav{padding:8px 12px;flex:1;overflow-y:auto}
.shell-pc .pcnav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;
  font-size:13.5px;color:rgba(255,255,255,.5);background:none;border:none;text-align:left;cursor:pointer;
  border-radius:8px;transition:var(--tr);margin-bottom:2px}
.shell-pc .pcnav button:hover{background:rgba(255,255,255,.08);color:#fff}
.shell-pc .pcnav button.active{background:#2563eb;color:#fff;font-weight:600}

.mt{position:fixed;top:0;left:0;right:0;z-index:100;padding:10px 16px;
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.95);border-bottom:1px solid #e5e7eb}
.mt h2{font-size:16px;font-weight:700;color:#0f172a}
.mt p{font-size:11px;color:#64748b;margin-top:1px}
.mt .ti{font-size:11px;color:#64748b;margin-right:8px;white-space:nowrap}

.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-h{font-weight:700;font-size:15px;color:#0f172a;margin-bottom:10px;
  padding-bottom:8px;border-bottom:1px solid #f1f5f9}

.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:12px 14px;border:1px solid #d1d5db;
  border-radius:8px;font-size:16px;background:#f8fafc;color:#0f172a;outline:none;
  font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#2563eb;background:#fff;
  box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.fld textarea{resize:vertical;min-height:70px}

.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;
  border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:var(--tr)}
.bt:active{transform:scale(.98)}
.bt-p{background:#2563eb;color:#fff}
.bt-p:active{background:#1d4ed8}
.bt-b{width:100%;padding:16px;font-size:17px}
.bt-sm{padding:7px 14px;font-size:13px;border-radius:6px}
.bt-o{background:#fff;border:1px solid #d1d5db;color:#334155}
.bt-o:hover{background:#f8fafc}
.bt-d{background:#dc2626;color:#fff}
.bt-s{background:#059669;color:#fff}

.bt-exit{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.1);
  padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.bt-exit:hover{background:rgba(220,38,38,.2);color:#fca5a5}
.bt-exit-mob{background:#f1f5f9;color:#64748b;border:none;
  padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer}

.lt-btn{display:inline-flex;border-radius:6px;overflow:hidden;border:1px solid #d1d5db}
.lt-btn button{padding:3px 10px;font-size:11px;font-weight:600;border:none;cursor:pointer;
  background:#fff;color:#94a3b8;transition:var(--tr)}
.lt-btn button.active{background:#2563eb;color:#fff}
.lt-btn button:not(:last-child){border-right:1px solid #d1d5db}

.bi-c input{min-height:auto}

.emp{padding:32px;text-align:center;color:#94a3b8;font-size:13px}

/* Tags */
.tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.tg-p{background:#fef3c7;color:#92400e}
.tg-d{background:#d1fae5;color:#065f46}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:16px}
.st{background:#fff;border-radius:10px;padding:14px;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.04)}
.st-n{font-size:28px;font-weight:700;color:#0f172a}
.st-l{font-size:10px;color:#64748b;margin-top:2px}

.edb{font-size:11px;margin-left:4px;cursor:pointer;color:#2563eb;text-decoration:none}
.edb:hover{text-decoration:underline}

/* DC */
.dc{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.04)}
.dc-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.dc-h h4{font-size:15px;font-weight:700}
.dc-p{font-size:13px;font-weight:600;color:#2563eb;padding:4px 12px;
  background:#eff6ff;border-radius:6px}
.dc-b .dc-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;
  border-bottom:1px solid #f1f5f9}
.dc-b .dc-row:last-child{border:none}
.dc-l{color:#64748b}
.dc-v{color:#0f172a;font-weight:500}

/* Request row */
.rr{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:6px;font-size:13px;
  box-shadow:0 1px 2px rgba(0,0,0,.03)}
.rr-b{display:flex;justify-content:space-between;align-items:center}
.rr-t{font-weight:600;color:#0f172a}
.rr-e{font-size:11px;color:#64748b;margin:3px 0;font-style:italic}
.rr-m{display:flex;gap:14px;font-size:11px;color:#64748b;margin-top:4px;flex-wrap:wrap}

/* Login */
#login-screen{position:fixed;inset:0;background:#f8fafc;z-index:4000;
  display:flex;justify-content:center;align-items:center}
.login-box{background:#fff;padding:40px 32px;width:340px;border-radius:var(--rx);
  text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08);border:1px solid #e5e7eb}
.login-box h2{font-size:20px;font-weight:700;color:#0f172a;margin-bottom:4px}
.login-box .lsm{font-size:11px;color:#94a3b8;margin-bottom:24px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:5000;
  display:flex;justify-content:center;align-items:center}
.modal-bg.hide{display:none}
.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:500px;width:90%;
  box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-box.sig{max-width:600px;padding:20px}
.sig-canvas{width:100%;height:200px;background:#fff;border-radius:10px;
  cursor:crosshair;border:2px solid #d1d5db}

/* Toast */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#059669;color:#fff;padding:12px 28px;border-radius:10px;
  font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);
  z-index:7000;opacity:0;transition:0.3s ease;pointer-events:none;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* Sidebar user info */
.pcuinfo{padding:14px;border-top:1px solid rgba(255,255,255,.1);cursor:default;font-size:12px}
.pcu-row{display:flex;align-items:center;gap:10px}
.pcu-avatar{width:32px;height:32px;border-radius:8px;

  display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.pcu-name{font-weight:600;color:#fff}
.pcu-dept{font-size:10px;color:rgba(255,255,255,.6)}
.pcu-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;
  margin-top:6px;display:inline-block;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff}
.pcu-locked{font-size:10px;color:rgba(255,255,255,.4);margin-top:4px}

/* Responsive */
@media(max-width:768px){
  .shell-pc{display:none}.shell{display:block}
}
@media(min-width:769px){
  .shell{display:none}.shell-pc{display:flex}
}

const today=()=>fmtD(new Date());

function showModal(h,ctr){const r=document.getElementById('modal-root');r.innerHTML='';
  const m=document.createElement('div');m.className='mask'+(ctr?' ctr':'');
  m.innerHTML='<div class="modal">'+h+'</div>';
  m.onclick=e=>{if(e.target===m)closeModal();};
  r.appendChild(m);}

let sbClient=null;
async function sbInit(){
  if(typeof supabase==='undefined')return null;
  if(!sbClient){
    sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}});
  }
  return sbClient;
}
async function sbUpsert(table,data){
  const sb=await sbInit();if(!sb)return false;
  try{
    const row=Array.isArray(data)?data[0]:data;
    const {error}=await sb.from(table).upsert(Array.isArray(data)?data:[data]);
    if(error)console.error('sb upsert error',table,error);
    return !error;
  }catch(e){return false;}
}

  const sb=await sbInit();if(!sb)return null;
  try{
    const {data,error}=await sb.from(table).select('*');
    if(error){console.error('sb load error',table,error);return null;}
    return data;
  }catch(e){return null;}
}
async function sbDel(table,id){
  const sb=await sbInit();if(!sb)return false;
  try{await sb.from(table).delete().eq('id',id);return true;}catch(e){return false;}
}
async function syncTable(table,localData){
  const remote=await sbLoad(table);
  if(!remote)return localData;
  // Merge: remote wins, but keep local-only entries
  const map=new Map((remote||[]).map(r=>[r.id,r]));
  (localData||[]).forEach(r=>{if(!map.has(r.id))map.set(r.id,r);});
  const merged=[...map.values()];
  sbUpsert(table,merged);return merged;
}


// Initialize cloud database tables
async function sbCreateTables(){
  const sb=await sbInit();if(!sb)return false;
  // Use RPC for raw SQL via service - but anon can't create tables
  // Tables need to be pre-created in Supabase dashboard
  // We just verify they exist
  const tables=['kmc_vehicles','kmc_drivers','kmc_users','kmc_requests','kmc_dispatches','kmc_settings'];
  for(const t of tables){
    const {error}=await sb.from(t).select('id').limit(1);
    if(error){console.log('Table missing:',t,error.message);}
  }
  return true;
}

async function pushDailySummary(){
  const today_=today();
  const reqs=DB.requests.get().filter(r=>r.date===today_);
  const ds=DB.dispatches.get().filter(d=>d.date===today_);
  if(!reqs.length&&!ds.length)return toast('今日无需求 / No requests today');
  
  // Format summary
  let msg='【KMC 车辆调度日报】\n'+today_+' ('+fmtL(today_)+')\n';
  msg+='════════════════════\n\n';
  
  if(reqs.length){
    msg+='📋 待处理需求 ('+reqs.length+'条)：\n';
    reqs.slice(0,10).forEach((r,i)=>{
      msg+=(i+1)+'. ['+r.department+'] '+r.purpose+'\n';
      msg+='   ⏰ '+r.timeSlot+' | 👤 '+r.submitter+'\n';
      if(r.destination)msg+='   📍 '+r.destination+'\n';
    });
    if(reqs.length>10)msg+='   ... 共'+reqs.length+'条，请登录系统查看完整清单\n';
    msg+='\n';
  }
  if(ds.length){
    msg+='🚗 已派车辆 ('+ds.length+'辆)：\n';
    ds.forEach((d,i)=>{
      msg+=(i+1)+'. '+d.vehicle+' | '+d.driver+' | '+d.departureTime+'\n';
    });
    msg+='\n';
  }
  msg+='🔗 系统入口: https://375c28bdbb4544e1a2a1a66ec159a3f3.sh3.agentos-app.net\n';
  msg+='⏰ 截止时间: '+getCutoff()+'\n';
  
  // Push to WeChat
  const wxUrl=DB.wxhook.get();
  if(wxUrl){
    toast('🔄 正在推送至微信...');
    try{
      const r=await fetch(wxUrl,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({msgtype:'text',text:{content:msg}})});
      if(r.ok){toast('✅ 微信推送成功');}
      else{toast('⚠ 微信推送失败: HTTP '+r.status);}
    }catch(e){toast('⚠ 微信推送失败 (网络)');}
  }
  
  // WhatsApp
  const waNum=DB.waphone.get();
  if(waNum){
    const waMsg=encodeURIComponent(msg.replace(/\n/g,'%0a').replace(/\*/g,''));
    const waUrl='https://wa.me/'+waNum.replace(/[^0-9]/g,'')+'?text='+waMsg;
    window.open(waUrl,'_blank');
    toast('📱 WhatsApp 已打开');
  }
  
  if(!wxUrl&&!waNum)return toast('请先在设置中配置推送渠道');
  
  DB.lastpush.set(today_);
}


async function syncAll(){
  const sb=await sbInit();if(!sb){console.log('Supabase not connected');return;}
  await sbCreateTables();
  // Sync each table
  const tables=[
    ['kmc_vehicles',DB.vehicles.get()],
    ['kmc_drivers',DB.drivers.get()],
    ['kmc_users',DB.users.get()],
    ['kmc_requests',DB.requests.get()],
    ['kmc_dispatches',DB.dispatches.get()],
  ];
  for(const [table,local] of tables){
    const remote=await sbLoad(table);
    if(remote===null)continue;
    if(remote&&remote.length){
      // Remote has data, use it
      const key=table.replace('kmc_','');
      const LS=LS(key);
      const localMap=new Map((local||[]).map(r=>[r.id,r]));
      const merged=[...remote.map(r=>({...localMap.get(r.id)||{},...r}))];
      LS.set(merged);
    }
  }
  // Sync settings
  const settingsRemote=await sbLoad('kmc_settings');
  if(settingsRemote){
    settingsRemote.forEach(s=>{
      if(s.key==='invite')DB.invite.set(s.value);
      if(s.key==='cutoff')DB.cutoff.set(s.value);
    });
  }
  // Push local data to cloud
  for(const [table,local] of tables){
    if(local&&local.length)await sbUpsert(table,local);
  }
  await sbUpsert('kmc_settings',[{key:'invite',value:DB.invite.get()},{key:'cutoff',value:DB.cutoff.get()}]);
}

async function sbSyncOne(table,data){
  await sbUpsert('kmc_'+table,data);
}

async function sbDelOne(table,id){
  await sbDel('kmc_'+table,id);
}

// Tap counter for hidden admin unlock
function setupTapCounter(){
  const el=document.getElementById('pcuinfo');
  if(!el)return;
  // Only stone account can unlock admin mode
  const isOwner=S.user&&S.user.name==='石秋迅';
  // Remove old listener if any
  el.onclick=null;
  if(!isOwner){
    // For non-owner, no click handler
    el.style.cursor='default';
    return;
  }
  el.style.cursor='pointer';
  el.onclick=()=>{
    S.tapCount++;
    if(S.tapCount>=7){
      S.tapCount=0;
      showPasswordModal();
    }else if(S.tapCount>=3){
      // Subtle hint at 3 taps
      const hint=document.createElement('div');
      hint.textContent=S.tapCount+'/7';
      hint.style.cssText='position:fixed;bottom:80px;right:20px;background:#1e293b;color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;z-index:200;opacity:0;transition:opacity .2s';
      document.body.appendChild(hint);
      requestAnimationFrame(()=>hint.style.opacity='1');
      setTimeout(()=>{hint.style.opacity='0';setTimeout(()=>hint.remove(),300);},800);
    }
    // Reset after 2s of inactivity
    clearTimeout(S.tapTimer);
    S.tapTimer=setTimeout(()=>{S.tapCount=0;},2000);
  };
}

function doLogin(){
  const dept=document.getElementById('ld').value;
  const name=document.getElementById('ln').value.trim();
  if(!dept)return toast('Select department / 请选择部门');
  if(!name)return toast('Enter your name / 请输入姓名');

  // Auto-register or login existing user
  const us=DB.users.get();
  const existingUser=us.find(u=>u.name===name&&u.department===dept);
  if(!existingUser){
    us.push({name,department:dept,firstLogin:new Date().toISOString(),lastLogin:new Date().toISOString(),role:'user',password:''});
  }else{existingUser.lastLogin=new Date().toISOString();}
  DB.users.set(us);
  S.user={name,department:dept,role:(dept==='后勤部'&&name==='石秋迅')?'admin':'user'};

function changeMyPw(){
  const old=document.getElementById('my-old-pw').value.trim();
  const newPw=document.getElementById('my-new-pw').value.trim();
  if(!old)return toast('Enter current password or invite code');
  if(!newPw||newPw.length<4)return toast('New password must be at least 4 characters');
  // Verify old
  const us=DB.users.get();
  const u=us.find(u=>u.name===S.user.name&&u.department===S.user.department);
  const expectedOld=(u&&u.password)?u.password:DB.invite.get();
  if(old!==expectedOld)return toast('Current password incorrect / 当前密码错误');
  // Save new
  if(!u){us.push({name:S.user.name,department:S.user.department,password:newPw,
    firstLogin:new Date().toISOString(),lastLogin:new Date().toISOString(),role:S.user.role});}
  else{u.password=newPw;}
  DB.users.set(us);
  document.getElementById('my-old-pw').value='';
  document.getElementById('my-new-pw').value='';
  toast('Password updated / 密码已更新 — next login use new password');
}

// Smart translate: copy content from active field to the other language field
function doTranslate(field){
  let cnId,enId;
  if(field==='dest'){cnId='rq-dest';enId='rq-destEn';}
  else if(field==='purpose'){cnId='rq-purpose';enId='rq-purposeEn';}
  else{cnId='rq-notes';enId='rq-notesEn';}
  const cnEl=document.getElementById(cnId),enEl=document.getElementById(enId);
  if(!cnEl||!enEl)return toast('字段错误 / Field error');
  let srcId,dstId;
  if(cnEl.value.trim()){srcId=cnId;dstId=enId;}
  else if(enEl.value.trim()){srcId=enId;dstId=cnId;}
  else return toast('请先在当前语言框中输入内容 / Please enter content first');
  const srcText=document.getElementById(srcId).value.trim();
  const srcLang=srcId===cnId?'zh-CN':'en-US';
  const tgtLang=srcLang==='zh-CN'?'en-US':'zh-CN';
  const dstEl=document.getElementById(dstId);
  const btn=dstEl.parentElement?dstEl.parentElement.querySelector('[data-tr-btn="'+field+'"]'):null;
  if(btn){btn.disabled=true;btn.textContent='⏳ 翻译中...';}
  toast('🔄 正在调用在线翻译...');
  fetch('https://api.mymemory.translated.net/get?langpair='+srcLang+'|'+tgtLang+'&q='+encodeURIComponent(srcText))
    .then(r=>r.json())
    .then(data=>{
      let translated='';
      if(data&&data.responseStatus===200&&data.responseData&&data.responseData.translatedText){translated=data.responseData.translatedText;}
      if(translated){dstEl.value=translated;toast('✅ 翻译完成 / Translation complete');      /* Auto-show translated field */      cnEl.style.display=srcId===cnId?'none':'block';      enEl.style.display=srcId===cnId?'block':'none';      if(field==='purpose'){S.pLang=srcId===cnId?'en':'cn';updatePurposeStatus();}      else if(field==='dest')S.dLang=srcId===cnId?'en':'cn';      else S.nLang=srcId===cnId?'en':'cn';}
      else{dstEl.value=srcText;toast('⚠ 翻译失败，已复制原文');}
    })
    .catch(e=>{dstEl.value=srcText;toast('⚠ 网络失败，已复制原文');})
    .finally(()=>{if(btn){btn.disabled=false;btn.textContent='🔄 翻译到 '+(srcLang==='zh-CN'?'EN':'CN');}});
}

function delReq(id){
  if(!confirm('Delete?'))return;
  let reqs=DB.requests.get();reqs=reqs.filter(r=>r.id!==id);DB.requests.set(reqs);
  toast('Deleted');renderPage();
}

function openEditReq(id){
  const r=DB.requests.get().find(x=>x.id===id);if(!r)return;
  showModal('<h3>✏️ '+T('edit')+'</h3>'
    +'<div class="fld"><label>Date</label><input type="date" id="er-date" value="'+r.date+'"></div>'
    +'<div class="fld"><label>Time</label><input type="text" id="er-time" value="'+r.timeSlot+'"></div>'
    +'<div class="fld"><label>Pax</label><input type="number" id="er-pax" value="'+r.passengers+'"></div>'
    +'<div class="fld"><label>Purpose CN</label><textarea id="er-p" style="min-height:60px">'+r.purpose+'</textarea></div>'
    +'<div class="fld"><label>Purpose EN</label><textarea id="er-pe" style="min-height:60px">'+r.purposeEn+'</textarea></div>'
    +'<div style="text-align:right"><button class="bt bt-o bt-sm" onclick="closeModal()">Cancel</button> <button class="bt bt-p bt-sm" onclick="saveEditReq(\''+id+'\')">Save</button></div>',true);
}
function saveEditReq(id){
  const reqs=DB.requests.get();const r=reqs.find(x=>x.id===id);if(!r)return;
  r.date=document.getElementById('er-date').value||r.date;
  r.timeSlot=document.getElementById('er-time').value||r.timeSlot;
  r.passengers=parseInt(document.getElementById('er-pax').value)||r.passengers;
  r.purpose=document.getElementById('er-p').value.trim()||r.purpose;
  r.purposeEn=document.getElementById('er-pe').value.trim()||r.purposeEn;
  DB.requests.set(reqs);closeModal();toast('Updated');renderPage();
}

function doSubmit(){
  const date=document.getElementById('rq-date').value;
  const dep=document.getElementById('rq-dep').value,ret=document.getElementById('rq-ret').value;
  const time=(dep&&ret)?(dep+'-'+ret):(dep||ret||'');
  // Parse pax names from textarea (one per line OR comma-separated)
  const paxRaw=document.getElementById('rq-pax-names').value.trim();
  const paxNames=paxRaw?(paxRaw.split(/[,\n\r，]/).map(s=>s.trim()).filter(Boolean)):[];
  const pax=paxNames.length||1;
  const purpose=document.getElementById('rq-purpose').value.trim();
  const purposeEn=document.getElementById('rq-purposeEn').value.trim();
  const dest=document.getElementById('rq-dest').value.trim();
  const destEn=document.getElementById('rq-destEn').value.trim();
  const notes=document.getElementById('rq-notes').value.trim();
  const notesEn=document.getElementById('rq-notesEn').value.trim();
  if(!date||!dep||!ret||!dest||!purpose||!purposeEn)return toast(L==='zh'?'请填写日期、出发返程时间和中英双语外出事由':'Please fill date, departure/return time and bilingual purpose');
  

  const reqs=DB.requests.get();
  reqs.push({id:uid(),date,timeSlot:time,passengers:pax,paxNames,purpose,purposeEn,
    destination:dest||'',destinationEn:destEn||'',notes:notes||'',notesEn:notesEn||'',
    approved:'yes',signature:S.sigData,department:S.user.department,submitter:S.user.name,
    status:'pending',mergedToDispatchId:null,createdAt:new Date().toISOString()});
  DB.requests.set(reqs);sbSyncOne('requests',DB.requests.get());
  toast(T('common_success'));
  S.sigData='';
  renderPage();
}

function openSig(){
  showModal('<h3>📝 '+T('submit_signTitle')+'</h3>'
    +'<canvas id="sig-cvs" class="sig-pad"></canvas>'
    +'<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="bt bt-o bt-sm" onclick="sigClear()">🗑️ Clear</button>'
    +'<div style="flex:1"></div><button class="bt bt-o bt-sm" onclick="closeModal()">'+T('common_cancel')+'</button>'
    +'<button class="bt bt-p bt-sm" onclick="sigSave()">✓ Save</button></div>',true);
  setTimeout(initSig,150);
}
let sigCtx=null,sigDrawing=false,sigLX=0,sigLY=0,sigDone=false;
function initSig(){
  const c=document.getElementById('sig-cvs');if(!c)return;
  const r=c.getBoundingClientRect();
  c.width=r.width*2;c.height=r.height*2;
  sigCtx=c.getContext('2d');sigCtx.scale(2,2);
  sigCtx.strokeStyle='#0f172a';sigCtx.lineWidth=2.5;sigCtx.lineCap='round';sigCtx.lineJoin='round';
  if(S.sigData){const img=new Image();img.onload=()=>{sigCtx.drawImage(img,0,0,r.width,r.height);sigDone=true;};img.src=S.sigData;}
  c.onmousedown=e=>{sigDrawing=true;sigDone=true;const p=pos(e,c);sigLX=p.x;sigLY=p.y;};
  c.onmousemove=e=>{if(!sigDrawing)return;const p=pos(e,c);sigCtx.beginPath();sigCtx.moveTo(sigLX,sigLY);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();sigLX=p.x;sigLY=p.y;};
  c.onmouseup=c.onmouseleave=()=>{sigDrawing=false;};
  c.ontouchstart=e=>{e.preventDefault();sigDrawing=true;sigDone=true;const t=e.touches[0];const p=pos(t,c);sigLX=p.x;sigLY=p.y;};
  c.ontouchmove=e=>{e.preventDefault();if(!sigDrawing)return;const t=e.touches[0];const p=pos(t,c);sigCtx.beginPath();sigCtx.moveTo(sigLX,sigLY);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();sigLX=p.x;sigLY=p.y;};
  c.ontouchend=()=>{sigDrawing=false;};
}
function pos(e,c){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function sigClear(){const c=document.getElementById('sig-cvs');if(!c)return;const r=c.getBoundingClientRect();sigCtx.clearRect(0,0,r.width,r.height);sigDone=false;S.sigData='';}
function sigSave(){
  if(!sigDone)return toast('Please sign first');
  S.sigData=document.getElementById('sig-cvs').toDataURL('image/png');
  const st=document.getElementById('sig-st');if(st)st.style.display='block';
  const btn=document.getElementById('sig-btn');if(btn)btn.textContent='✏️ Edit Signature';
  closeModal();toast('Signature saved');
}

function buildDC(d){
  const rl=DB.requests.get().filter(r=>d.requestIds.includes(r.id));
  const pax=rl.reduce((s,r)=>s+r.passengers,0);
  const depts=[...new Set(rl.map(r=>dShow(r.department)))].join('、');
  const prps=L==='zh'?[...new Set(rl.map(r=>r.purpose))].join('；'):[...new Set(rl.map(r=>r.purposeEn||r.purpose))].join('; ');
  const prpsE=L==='zh'&&rl.some(r=>r.purposeEn)?[...new Set(rl.map(r=>r.purposeEn))].join('; '):'';
  const dnotesCn=d.notes||'';
  const dnotesEn=d.notesEn||'';
  const paxNames=[];
  rl.forEach(r=>{if(r.paxNames)r.paxNames.forEach(n=>{if(n)paxNames.push(n);});});
  if(!paxNames.length)rl.forEach(r=>paxNames.push(r.submitter));
  return '<div class="dc"><div class="dc-h"><div><h4>'+T('dispatch_title')+'</h4><div style="font-size:11px;opacity:.7">'+fmtL(d.date)+' ('+d.date+')</div></div><div class="dc-p">'+d.vehicle+'</div></div>'

    +'<div class="dc-row"><span class="dc-l">'+T('meeting_point')+' / Point</span><span class="dc-v">'+(d.meetingPoint||'—')+'</span></div>'
    +'<div class="dc-row"><span class="dc-l">'+T('pax')+' / Pax</span><span class="dc-v">'+pax+'</span></div>'
    +'<div class="dc-row"><span class="dc-l">'+T('dept')+' / Dept</span><span class="dc-v">'+depts+'</span></div>'
    +'<div class="dc-row"><span class="dc-l">'+T('purpose')+' / Purpose</span><span class="dc-v">'+prps+(prpsE?' <small style="color:#64748b;font-style:italic">('+prpsE+')</small>':'')+'</span></div>'
    +'<div class="dc-row"><span class="dc-l">👥 '+bi('乘车人','Passengers')+'</span><span class="dc-v">'+paxNames.join('、')+'</span></div>'
    +(dnotesCn?'<div class="dc-row"><span class="dc-l">'+T('notes')+' / Notes</span><span class="dc-v">'+dnotesCn+(dnotesEn?' <small style="color:#64748b;font-style:italic">('+dnotesEn+')</small>':'')+'</span></div>':'')

function expImg(){
  if(!isAdmin())return;
  const _t=today();const ds=DB.dispatches.get().filter(d=>d.date===_t);
  if(!ds.length)return toast(T('common_no'));
  const cvs=document.createElement('canvas');cvs.width=420;cvs.height=120+ds.length*155;
  const ctx=cvs.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.fillStyle='#0f172a';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText('KMC Vehicle Dispatch',210,38);
  ctx.fillStyle='#64748b';ctx.font='13px sans-serif';ctx.fillText(fmtL(_t)+' | '+_t,210,56);
  let y=76;
  ds.forEach(d=>{
    const rl=DB.requests.get().filter(r=>d.requestIds.includes(r.id));
    const pax=rl.reduce((s,r)=>s+r.passengers,0);
    ctx.fillStyle='#f8fafc';ctx.fillRect(10,y,400,140);
    ctx.strokeStyle='#d1d5db';ctx.strokeRect(10,y,400,140);
    ctx.fillStyle='#2563eb';ctx.font='bold 26px sans-serif';ctx.textAlign='right';ctx.fillText(d.vehicle,395,y+36);
    ctx.fillStyle='#1e293b';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('Driver: '+d.driver,22,y+26);

    +'<span style="color:#94a3b8">→</span>'

    +'</div></div>';
  html+='<div class="fld"><label>🏢 '+T('select_depts')+(S.fDepts.length?' · '+T('selected')+' '+S.fDepts.length:'')+'</label>'
    +'<div style="display:flex;flex-wrap:wrap;gap:6px">'+deptChips
    +(S.fDepts.length?'<button onclick="S.fDepts=[];renderPage()" style="padding:5px 10px;border-radius:16px;font-size:12px;border:1.5px solid #dc2626;background:#fef2f2;color:#dc2626;cursor:pointer">'+T('reset')+'</button>':'')
    +'</div></div></div>';

  if(reqs.length){
    html+=reqs.map(r=>{
      const apv=r.approved?('<span class="tag '+(r.approved==='yes'?'tg-d':'tg-r')+'" style="margin-left:4px">'+(r.approved==='yes'?'✓':'✗')+'</span>'):'';
      return '<div class="rr" id="rr-'+r.id+'" onclick="togR(\''+r.id+'\')"><div class="rr-c"></div><div class="rr-b"><div class="rr-t">'
        +(L==='zh'?r.purpose:(r.purposeEn||r.purpose))+' '+apv+'</div>'
        +'<div class="rr-m"><span>📅 '+r.timeSlot+'</span><span>👥 '+r.passengers+'</span><span>'+dShow(r.department)+'</span><span>👤 '+r.submitter+'</span></div></div></div>';
    }).join('');
    html+='<div style="margin:12px 0;display:flex;gap:6px"><button class="bt bt-p" id="bt-disp" onclick="showDisp()">🚗 '+T('pool_merge')+'</button><button class="bt bt-o bt-sm" onclick="selAll()">Select All</button></div>';
  }
  if(done.length){
    html+='<div class="sec-title">✅ '+T('stat_dispatched')+'</div>';
    const g={};done.forEach(r=>{const k=r.mergedToDispatchId||'?';if(!g[k])g[k]=[];g[k].push(r);});
    Object.entries(g).forEach(([k,grp])=>{const dd=DB.dispatches.get().find(d=>d.id===k);
      html+='<div class="card"><div class="card-h"><div>🚗 '+(dd?dd.vehicle:'?')+' · '+(dd?dd.driver:'?')+'</div><div class="cha"><button class="bt bt-o bt-sm" onclick="editD(\''+k+'\')">'+T('edit')+'</button><button class="bt bt-d bt-sm" onclick="cancelD(\''+k+'\')">'+T('cancel')+'</button></div></div>'

    });
  }
  if(!reqs.length&&!done.length)html+='<div class="emp">No requests for this date</div>';

function togR(id){const e=document.getElementById('rr-'+id);if(!e)return;

function togDept(d){
  const i=S.fDepts.indexOf(d);

function doDisp(){const rIds=[...S.selReqs];const v=document.getElementById('md-v').value.split(' - ')[0];
  const d=document.getElementById('md-d').value,t2=document.getElementById('md-t').value.trim();
  const p=document.getElementById('md-p').value.trim(),n=document.getElementById('md-nt').value.trim();
  const firstR=DB.requests.get().find(r=>r.id===rIds[0]);const did=uid();
  const ds=DB.dispatches.get();ds.push({id:did,date:firstR.date,vehicle:v,driver:d,
    departureTime:t2||null,meetingPoint:p||null,notes:n||'',requestIds:rIds,createdAt:new Date().toISOString()});DB.dispatches.set(ds);

  S.selReqs.clear();closeModal();toast('Dispatched');renderPage();}

  html+='<div style="margin-top:14px;display:flex;gap:8px"><button class="bt bt-o bt-sm" onclick="resetRecFilters()">🔄 '+T('reset')+'</button><div class="sp"></div><button class="bt bt-p bt-sm" onclick="expPDF()">📄 PDF / 台账</button><button class="bt bt-o bt-sm" onclick="expCSV()">📥 CSV</button></div>';
  html+='</div>';

  let fd=ds;
  if(S.fFrom)fd=fd.filter(d=>d.date>=S.fFrom);
  if(S.fTo)fd=fd.filter(d=>d.date<=S.fTo);
  if(S.fVeh)fd=fd.filter(d=>d.vehicle===S.fVeh);
  if(S.recKeyword){const kw=S.recKeyword.toLowerCase();fd=fd.filter(d=>{const rl=rs.filter(r=>d.requestIds.includes(r.id));return rl.some(r=>(r.purpose||"").toLowerCase().includes(kw)||(r.purposeEn||"").toLowerCase().includes(kw)||(r.destination||"").toLowerCase().includes(kw)||(r.destinationEn||"").toLowerCase().includes(kw));});}
  if(S.recDriver)fd=fd.filter(d=>d.driver===S.recDriver);
  if(S.recSort==="date-asc")fd.sort((a,b)=>a.date.localeCompare(b.date));
  else if(S.recSort==="plate-asc")fd.sort((a,b)=>a.vehicle.localeCompare(b.vehicle));
  else if(S.recSort==="driver-asc")fd.sort((a,b)=>a.driver.localeCompare(b.driver));
  if(S.fDepts.length>0)fd=fd.filter(d=>{const rl=rs.filter(r=>d.requestIds.includes(r.id));return rl.some(r=>S.fDepts.includes(r.department));});
  if(!fd.length)html+='<div class="emp">'+T('no_match')+'</div>';
  else{html+=fd.map(d=>{
    const rl=rs.filter(r=>d.requestIds.includes(r.id));const pax=rl.reduce((s,r)=>s+r.passengers,0);
    const depts=[...new Set(rl.map(r=>r.department))];
    const prps=L==='zh'?[...new Set(rl.map(r=>r.purpose))].join('；'):[...new Set(rl.map(r=>r.purposeEn||r.purpose))].join('; ');
    const prpsE=L==='zh'&&rl.some(r=>r.purposeEn)?[...new Set(rl.map(r=>r.purposeEn))].join('; '):'';
    return '<div class="card"><div class="card-h"><div>📅 '+fmtL(d.date)+' ('+d.date+') · 🚗 '+d.vehicle+' · 👤 '+d.driver+'</div><button class="bt bt-o bt-sm" onclick="editD(\''+d.id+'\')">'+T('edit')+'</button></div>'
      +'<div style="font-size:13px;color:#64748b">'+T('pax')+': '+pax+' · '+T('dept')+': '+depts.map(dShow).join(' / ')+' · '+T('meeting_point')+': '+(d.meetingPoint||'—')+'</div>'
      +'<div style="font-size:14px;margin-top:4px;color:#0f172a">'+prps+'</div>'
      +(prpsE?'<div style="font-size:13px;color:#64748b;font-style:italic;margin-top:2px">'+prpsE+'</div>':'')
      +(d.notes?'<div style="font-size:12px;color:#94a3b8;margin-top:4px">📝 '+T('notes')+': '+d.notes+'</div>':'')
      +'</div>';
  }).join('');}
  return html;
}

function changeAdminPw(){

  localStorage.setItem('kmc2_admin_pw',pw);
  document.getElementById('new-pw').value='';
  toast('Password updated');
}

function saveV(i){const vs=DB.vehicles.get();vs[i].plate=document.getElementById('ev-p').value.trim();vs[i].type=document.getElementById('ev-t').value.trim();vs[i].typeEn=document.getElementById('ev-te').value.trim()||vs[i].type;vs[i].seats=parseInt(document.getElementById('ev-s').value)||5;DB.vehicles.set(vs);closeModal();toast('Updated');renderPage();}

// User management - distribute/delete accounts covering all departments
function addUser(){
  const name=document.getElementById('nu-n').value.trim();
  const dept=document.getElementById('nu-d').value;
  if(!name||!dept)return toast('Name and Department required');
  const us=DB.users.get();
  if(us.find(u=>u.name===name&&u.department===dept))return toast('User already exists');
  us.push({name,department:dept,role:'user',firstLogin:new Date().toISOString(),lastLogin:'-'});
  DB.users.set(us);toast('Added');renderPage();
}
function delUser(i){
  if(!confirm(T('common_cancel')+'?'))return;
  const us=DB.users.get();us.splice(i,1);DB.users.set(us);toast('Deleted');renderPage();
}
function editUser(i){
  const u=DB.users.get()[i];
  showModal('<h3>'+T('edit')+' '+T('user_name')+'</h3>'
    +'<div class="fld"><label>'+T('user_name')+' / Name</label><input id="eu-n" value="'+u.name+'"></div>'
    +'<div class="fld"><label>'+T('user_dept')+' / Department</label><select id="eu-d">'+DEPTS_CN.map(d=>'<option value="'+d+'" '+(d===u.department?'selected':'')+'>'+d+' / '+DCN2EN[d]+'</option>').join('')+'</select></div>'
    +'<div class="fld"><label>'+T('user_role')+' / Role</label><select id="eu-r"><option value="user" '+(u.role==='user'?'selected':'')+'>User 用户</option><option value="admin" '+(u.role==='admin'?'selected':'')+'>Admin 管理员</option></select></div>'
    +'<div style="text-align:right"><button class="bt bt-o bt-sm" onclick="closeModal()">'+T('common_cancel')+'</button> <button class="bt bt-p bt-sm" onclick="saveUser('+i+')">'+T('common_save')+'</button></div>',true);
}
function saveUser(i){
  const us=DB.users.get();const old=us[i];
  const oldName=old.name,oldDept=old.department;
  us[i].name=document.getElementById('eu-n').value.trim()||old.name;
  us[i].department=document.getElementById('eu-d').value;
  us[i].role=document.getElementById('eu-r').value;
  DB.users.set(us);
  // Update related requests
  const rs=DB.requests.get();
  rs.forEach(r=>{if(r.submitter===oldName&&r.department===oldDept){r.submitter=us[i].name;r.department=us[i].department;}});
  DB.requests.set(rs);closeModal();toast('Updated');renderPage();
}
function expData(){const data={vehicles:DB.vehicles.get(),drivers:DB.drivers.get(),requests:DB.requests.get(),dispatches:DB.dispatches.get(),users:DB.users.get(),invite:DB.invite.get(),exportedAt:new Date().toISOString()};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='KMC_Data_'+today()+'.json';a.click();URL.revokeObjectURL(u);toast('Exported');}
function impData(inp){if(!isAdmin())return;const f=inp.files[0];if(!f||!confirm('Overwrite all data?')){inp.value='';return;}
  const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.vehicles)DB.vehicles.set(d.vehicles);if(d.drivers)DB.drivers.set(d.drivers);if(d.requests)DB.requests.set(d.requests);if(d.dispatches)DB.dispatches.set(d.dispatches);if(d.users)DB.users.set(d.users);if(d.invite)DB.invite.set(d.invite);toast('Imported');renderPage();}catch{toast('Invalid file');}};r.readAsText(f);inp.value='';}
function wipe(){if(!isAdmin()||!confirm('Clear ALL data?')||!confirm('FINAL: Delete everything?'))return;
  ['vehicles','drivers','requests','dispatches','users','imported'].forEach(k=>LS(k).set([]));DB.init();toast('Cleared');renderPage();}

// ==================== BOOT ====================
(function(){
  const u=DB.user.get();
  if(u){S.user=u;showApp();setTimeout(()=>syncAll(),500);}
})();
