<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KMC派车">
<meta name="theme-color" content="#0a0a1a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22KMC%20Dispatcher%22%2C%22short_name%22%3A%22KMC%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a0a1a%22%2C%22theme_color%22%3A%22%230a0a1a%22%7D">
<title>KMC 车辆调度系统</title>
<style>
:root{
  --bg:#eef1f6;--bg-grad:linear-gradient(135deg,#f8fafc 0%,#e0e7ff 50%,#fce7f3 100%);
  --surface:rgba(255,255,255,.75);--surface2:rgba(255,255,255,.55);
  --brand:#0a0a1a;--brand2:#1e293b;
  --primary:#2563eb;--primary2:#1d4ed8;--primary-glow:rgba(37,99,235,.18);
  --success:#059669;--success-bg:rgba(5,150,105,.08);
  --danger:#dc2626;--danger-bg:rgba(220,38,38,.06);
  --warn:#d97706;--warn-bg:rgba(217,119,6,.08);
  --text:#0f172a;--text2:#475569;--text3:#64748b;--text4:#94a3b8;
  --border:rgba(255,255,255,.4);--border2:rgba(0,0,0,.06);
  --r:20px;--rs:14px;--rx:10px;
  --sh:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);
  --shm:0 8px 24px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.03);
  --shl:0 20px 60px rgba(0,0,0,.12);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
  --fs:17px;/* base font up one notch */
  --t:0.25s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:17px;-webkit-text-size-adjust:100%;}
body{font-family:var(--f);background:var(--bg-grad);color:var(--text);min-height:100dvh;
  line-height:1.55;-webkit-font-smoothing:antialiased;font-size:var(--fs);}
button,input,select,textarea{font-family:var(--f);font-size:1em;color:var(--text);}
button{touch-action:manipulation;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{color:var(--text);}
.hidden{display:none!important;}
::selection{background:var(--primary);color:#fff;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:4px;}

/* GLASS MIXINS */
.glass{background:var(--surface);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border);
  box-shadow:0 8px 32px rgba(0,0,0,.08),0 1px 1px rgba(0,0,0,.02);}
.glass-light{background:var(--surface2);backdrop-filter:blur(16px);border:1px solid var(--border);}

/* LOGIN */
.login-bg{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px;
  background:linear-gradient(135deg,#0a0a1a 0%,#1e3a5f 50%,#16213e 100%);position:relative;overflow:hidden;}
.login-bg::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 20%,rgba(37,99,235,.2) 0%,transparent 60%),
             radial-gradient(ellipse 50% 80% at 80% 90%,rgba(5,150,105,.15) 0%,transparent 60%),
             radial-gradient(ellipse 40% 60% at 10% 80%,rgba(168,85,247,.12) 0%,transparent 60%);}
.login-bg::after{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);
  background-size:24px 24px;opacity:.6;}
.login-card{position:relative;background:rgba(255,255,255,.88);backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border-radius:28px;box-shadow:0 25px 70px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.2);
  padding:48px 40px;width:100%;max-width:460px;}
.login-brand{text-align:center;margin-bottom:32px;}
.login-brand .lb-icon{width:56px;height:56px;
  background:linear-gradient(135deg,#1d4ed8,#3b82f6);border-radius:18px;
  margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(37,99,235,.35);}
.login-brand .lb-icon svg{width:28px;height:28px;fill:#fff;}
.login-brand h1{font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.5px;}
.login-brand p{font-size:13px;color:var(--text3);margin-top:4px;letter-spacing:.3px;}

/* FIELD */
.fg{margin-bottom:18px;text-align:left;}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--text2);
  margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase;}
.fg-hint{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.45;}
.fg-hint small{display:block;font-style:italic;margin-top:1px;}
.fg input,.fg select,.fg textarea{
  width:100%;padding:13px 15px;border:1.5px solid rgba(0,0,0,.08);
  border-radius:var(--rx);font-size:1em;background:rgba(255,255,255,.95);
  transition:all var(--t);appearance:none;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{
  outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px var(--primary-glow);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 22px;
  border-radius:var(--rx);font-size:1em;font-weight:600;transition:all var(--t);letter-spacing:.2px;
  white-space:nowrap;}
.btn-p{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;
  box-shadow:0 4px 12px rgba(37,99,235,.3);}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,.4);}
.btn-p:active{transform:translateY(0);}
.btn-b{width:100%;padding:16px;font-size:1.06em;border-radius:var(--rs);}
.btn-sm{padding:7px 14px;font-size:.85em;border-radius:6px;}
.btn-o{background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.08);color:var(--text2);
  backdrop-filter:blur(8px);}
.btn-o:hover{border-color:rgba(0,0,0,.15);background:rgba(255,255,255,.85);}
.btn-d{background:var(--danger);color:#fff;}
.btn-s{background:var(--success);color:#fff;}
.btn-w{background:var(--warn);color:#fff;}
.btn-gh{color:var(--text3);}.btn-gh:hover{color:var(--text);background:rgba(0,0,0,.05);border-radius:6px;}

/* LANG TOGGLE */
.ltg{display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,.15);
  border-radius:22px;padding:3px;border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);}
.ltg button{padding:6px 14px;border-radius:18px;font-size:11px;font-weight:700;
  color:rgba(255,255,255,.55);transition:all var(--t);letter-spacing:.3px;}
.ltg button.active{background:#fff;color:#0a0a1a;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.ltg-dark{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1);}

/* APP SHELL */
.app-pg{min-height:100dvh;display:flex;flex-direction:column;}
@media(min-width:1024px){.app-pg{flex-direction:row;}}

/* SIDEBAR */
.sbar{display:none;flex-direction:column;background:rgba(10,10,26,.92);color:#fff;width:240px;
  flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;padding:28px 0;
  backdrop-filter:blur(20px);}
@media(min-width:1024px){.sbar{display:flex;}}
.sb-h{padding:0 22px 24px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:8px;}
.sb-icon{width:40px;height:40px;background:linear-gradient(135deg,#2563eb,#3b82f6);
  border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  box-shadow:0 4px 12px rgba(37,99,235,.3);}
.sb-icon svg{width:22px;height:22px;fill:#fff;}
.sb-h h2{font-size:17px;font-weight:700;letter-spacing:-.3px;}
.sb-h .sb-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:3px;letter-spacing:.4px;}
.sbar .s-u{margin-top:auto;border-top:1px solid rgba(255,255,255,.06);padding:18px 22px 0;}
.sbar .s-u .su-n{font-size:14px;font-weight:600;}
.sbar .s-u .su-d{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;}
.sbar .s-u .su-b{display:inline-block;background:rgba(37,99,235,.4);color:#93c5fd;
  font-size:10px;padding:3px 9px;border-radius:4px;margin-top:6px;font-weight:700;letter-spacing:.3px;}
.sbar .lwrap{padding:6px 22px 14px;}
.s-nav{display:flex;flex-direction:column;gap:3px;padding:0 12px;}
.s-nav button{display:flex;align-items:center;gap:11px;padding:11px 16px;font-size:.92em;
  font-weight:500;color:rgba(255,255,255,.5);border-radius:11px;transition:all var(--t);
  width:100%;text-align:left;}
.s-nav button:hover{color:rgba(255,255,255,.75);background:rgba(255,255,255,.05);}
.s-nav button.active{color:#fff;background:rgba(37,99,235,.25);font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1);}
.s-nav button svg{width:19px;height:19px;opacity:.6;flex-shrink:0;}
.s-nav button.active svg{opacity:1;}

/* TOPBAR mobile */
.tbar{display:none;align-items:center;justify-content:space-between;padding:14px 16px;
  background:rgba(10,10,26,.92);color:#fff;position:sticky;top:0;z-index:50;
  backdrop-filter:blur(20px);}
@media(max-width:1023px){.tbar{display:flex;}}
.tbar h3{font-size:16px;font-weight:700;letter-spacing:-.2px;}
.tbar .tb-r{display:flex;align-items:center;gap:10px;}
.tbar .tb-i{font-size:11px;color:rgba(255,255,255,.5);}

/* MAIN */
.main-w{flex:1;overflow-y:auto;padding:24px 18px 88px;}
@media(min-width:1024px){.main-w{padding:36px 44px;}}
.page-v{display:none;max-width:1000px;margin:0 auto;}
.page-v.active{display:block;animation:fIn .25s ease;}
@keyframes fIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* BOTTOM NAV */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.85);
  backdrop-filter:blur(30px) saturate(180%);border-top:1px solid rgba(0,0,0,.06);
  z-index:50;padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 20px rgba(0,0,0,.05);}
@media(max-width:1023px){.bnav{display:flex;}}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;
  font-size:10px;color:var(--text3);transition:all var(--t);gap:2px;font-weight:500;}
.bnav button.active{color:var(--primary);}
.bnav button svg{width:21px;height:21px;}

/* CARDS */
.card{border-radius:var(--r);overflow:hidden;margin-bottom:16px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.6);box-shadow:0 8px 32px rgba(0,0,0,.06);}
.card-bd{padding:22px;}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.card-h h3{font-size:1.05em;font-weight:700;color:var(--text);letter-spacing:-.2px;}
.card-h .ch-b{display:flex;gap:6px;}

/* TAG */
.tag{display:inline-flex;align-items:center;padding:3px 11px;border-radius:13px;
  font-size:.78em;font-weight:600;letter-spacing:.2px;}
.tg-p{background:var(--warn-bg);color:var(--warn);}
.tg-d{background:var(--success-bg);color:var(--success);}
.tg-m{background:var(--primary-glow);color:var(--primary);}

/* NOTIFY */
.nt{background:linear-gradient(135deg,rgba(254,243,199,.9),rgba(253,224,71,.7));
  border:1px solid rgba(234,179,8,.4);border-radius:var(--rs);
  padding:16px 20px;margin-bottom:18px;display:flex;
  align-items:center;justify-content:space-between;backdrop-filter:blur(10px);}
.nt .nt-t{font-size:1em;font-weight:700;color:#854d0e;}
.nt .nt-n{font-size:30px;font-weight:800;color:#a16207;}

/* REQUEST ROW */
.rr{display:flex;align-items:flex-start;gap:12px;padding:14px;margin-bottom:8px;
  background:rgba(255,255,255,.6);border-radius:var(--rs);
  border:1.5px solid transparent;cursor:pointer;transition:all var(--t);
  backdrop-filter:blur(8px);}
.rr:hover{border-color:rgba(0,0,0,.1);box-shadow:var(--sh);}
.rr.sel{border-color:var(--primary);background:var(--primary-glow);}
.rr.merged{opacity:.5;pointer-events:none;}
.rr .rr-c{width:22px;height:22px;border-radius:6px;border:2px solid rgba(0,0,0,.15);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all var(--t);margin-top:2px;}
.rr.sel .rr-c{background:var(--primary);border-color:var(--primary);}
.rr.sel .rr-c::after{content:'';width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px;}
.rr-b{flex:1;min-width:0;}
.rr-t{font-size:1em;font-weight:600;line-height:1.4;}
.rr-m{font-size:.85em;color:var(--text3);margin-top:3px;display:flex;gap:11px;flex-wrap:wrap;}
.rr-d{font-size:.75em;color:var(--primary);font-weight:700;background:var(--primary-glow);padding:2px 8px;border-radius:5px;}
.rr-e{font-size:.92em;color:var(--text3);margin-top:4px;font-style:italic;}

/* DISPATCH CARD */
.dc{border-radius:var(--r);margin-bottom:18px;overflow:hidden;
  background:rgba(255,255,255,.85);backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.6);box-shadow:var(--shm);}
.dc-hd{background:linear-gradient(135deg,#0a0a1a,#1e3a5f);color:#fff;
  padding:18px 22px;display:flex;justify-content:space-between;align-items:center;}
.dc-hd h4{font-size:1.05em;font-weight:700;}
.dc-hd .dc-p{font-size:32px;font-weight:800;letter-spacing:1px;opacity:.95;}
.dc-bd{padding:18px 22px;}
.dc-row{display:flex;padding:8px 0;font-size:.95em;border-bottom:1px solid rgba(0,0,0,.05);}
.dc-row:last-child{border-bottom:none;}
.dc-l{color:var(--text3);width:96px;flex-shrink:0;font-size:.88em;}
.dc-v{color:var(--text);flex:1;font-weight:500;}
.dc-v small{color:var(--text3);font-weight:400;font-size:.85em;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
.st{border-radius:var(--rs);padding:18px 20px;text-align:center;
  background:rgba(255,255,255,.7);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.6);box-shadow:var(--sh);}
.st-n{font-size:32px;font-weight:800;color:var(--primary);letter-spacing:-1px;}
.st-l{font-size:.78em;color:var(--text3);margin-top:3px;}

/* FILTER BAR */
.ftb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.ftb select,.ftb input{padding:10px 13px;border:1.5px solid rgba(0,0,0,.08);border-radius:var(--rx);
  font-size:.92em;background:rgba(255,255,255,.95);min-width:110px;transition:all var(--t);}
.ftb select:focus,.ftb input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow);}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;}
.empty svg{width:80px;height:80px;margin-bottom:14px;opacity:.15;}
.empty p{font-size:1em;color:var(--text3);}

/* MODAL */
.mdl-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;animation:fIn .2s ease;
  backdrop-filter:blur(8px);}
.mdl-mask.ctr{align-items:center;}
.mdl{margin-top:30px;background:rgba(255,255,255,.95);backdrop-filter:blur(30px) saturate(180%);
  border-radius:24px 24px 0 0;padding:24px 22px;width:100%;max-width:540px;
  max-height:88vh;overflow-y:auto;animation:mdlUp .25s ease;}
.mdl-mask.ctr .mdl{border-radius:20px;margin:20px;}
@keyframes mdlUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.mdl h3{font-size:1.15em;font-weight:700;margin-bottom:14px;}

/* TOAST */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;
  padding:11px 24px;border-radius:22px;font-size:.92em;font-weight:600;z-index:300;
  opacity:0;pointer-events:none;transition:all .3s;box-shadow:var(--shl);}
.toast.show{opacity:1;}

/* ACTION BAR */
.acb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
.acb .sp{flex:1;}

/* SETTINGS */
.sr{display:flex;justify-content:space-between;align-items:center;padding:14px 0;
  border-bottom:1px solid rgba(0,0,0,.05);}
.sr:last-child{border-bottom:none;}
.sr-i{flex:1;}
.sr-l{font-size:.95em;font-weight:600;}
.sr-s{font-size:.78em;color:var(--text3);margin-top:2px;}
.sr-a{display:flex;gap:5px;}
.si{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.si input{flex:1;min-width:80px;padding:10px 12px;border:1.5px solid rgba(0,0,0,.08);border-radius:6px;font-size:.92em;}

/* BILINGUAL FORM */
.bi{display:flex;gap:12px;margin-bottom:16px;}
@media(max-width:680px){.bi{flex-direction:column;}}
.bi-c{flex:1;}
.bi-c label{display:block;font-size:.78em;font-weight:700;color:var(--text2);
  margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase;}
.bi-c label small{display:block;font-size:.92em;font-weight:500;color:var(--text3);
  text-transform:none;letter-spacing:0;margin-top:2px;font-style:italic;}
.bi-c textarea,.bi-c input{width:100%;padding:11px 13px;border:1.5px solid rgba(0,0,0,.08);
  border-radius:var(--rx);font-size:.95em;background:rgba(255,255,255,.95);resize:vertical;min-height:75px;
  transition:all var(--t);line-height:1.6;}
.bi-c input{min-height:auto;}
.bi-c textarea:focus,.bi-c input:focus{outline:none;border-color:var(--primary);
  background:#fff;box-shadow:0 0 0 3px var(--primary-glow);}

/* EDIT BUTTON */
.ed-b{font-size:.78em;color:var(--primary);cursor:pointer;font-weight:600;
  padding:2px 8px;border-radius:4px;margin-left:4px;}
.ed-b:hover{background:var(--primary-glow);}

/* SIGNATURE PAD */
.sig-pad{width:100%;height:200px;border:2px dashed rgba(0,0,0,.15);
  border-radius:var(--rx);background:rgba(255,255,255,.6);
  touch-action:none;cursor:crosshair;backdrop-filter:blur(8px);}
.sig-preview{max-width:180px;max-height:90px;border:1px solid rgba(0,0,0,.1);
  border-radius:6px;background:rgba(255,255,255,.7);padding:4px;}
.sig-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}

/* PRINT */
@media print{
  .sbar,.tbar,.bnav,.acb,.ftb,.nt,.stats,.btn,.ed-b{display:none!important;}
  .main-w{padding:0!important;}.page-v{max-width:100%!important;}
  .card,.dc{border:1px solid #000!important;break-inside:avoid;}
  body{background:#fff!important;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-bg" id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="lb-icon"><svg viewBox="0 0 24 24"><path d="M5 11l4-7h2l-4 7h4l-4 7H5l4-7H5zm10 0l4-7h2l-4 7h4l-4 7h-2l4-7h-4z"/></svg></div>
      <h1 id="login-title">KMC 车辆调度系统</h1>
      <p id="login-sub">Vehicle Dispatch System</p>
    </div>
    <div class="fg"><label id="lbl-code">邀请码 INVITE CODE</label>
      <input type="text" id="login-code" placeholder="Invite Code" autocomplete="off">
      <div class="fg-hint" id="hint-code">请输入管理员分发的邀请码<br><small>Enter the invite code provided by admin</small></div>
    </div>
    <div class="fg"><label id="lbl-dept">部门 DEPARTMENT</label>
      <select id="login-dept"></select>
      <div class="fg-hint" id="hint-dept">选择你所在的部门<br><small>Select your department</small></div>
    </div>
    <div class="fg"><label id="lbl-name">姓名 NAME</label>

const fmtCn=d=>{const t=new Date(d);return t.getMonth()+1+'月'+t.getDate()+'日';};
const fmtEn=d=>{const t=new Date(d);const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return m[t.getMonth()]+' '+t.getDate();};

function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w+r,y);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

let sigCtx=null,sigDrawing=false,sigLastX=0,sigLastY=0,sigHasInk=false;
function initSigCanvas(){
  const c=document.getElementById('sig-canvas');
  if(!c)return;
  // Resize for DPR
  const rect=c.getBoundingClientRect();
  c.width=rect.width*window.devicePixelRatio;
  c.height=rect.height*window.devicePixelRatio;
  sigCtx=c.getContext('2d');
  sigCtx.scale(window.devicePixelRatio,window.devicePixelRatio);
  sigCtx.strokeStyle='#0f172a';
  sigCtx.lineWidth=2.5;
  sigCtx.lineCap='round';sigCtx.lineJoin='round';
  // Restore previous if any
  if(S.sigDataUrl){
    const img=new Image();
    img.onload=()=>{sigCtx.drawImage(img,0,0,rect.width,rect.height);sigHasInk=true;};
    img.src=S.sigDataUrl;
  }
  // Mouse events
  c.onmousedown=sigStart;
  c.onmousemove=sigMove;
  c.onmouseup=sigEnd;c.onmouseleave=sigEnd;
  // Touch events
  c.ontouchstart=e=>{e.preventDefault();const t=e.touches[0];const r=c.getBoundingClientRect();sigStart({clientX:t.clientX,clientY:t.clientY,target:c});};
  c.ontouchmove=e=>{e.preventDefault();const t=e.touches[0];sigMove({clientX:t.clientX,clientY:t.clientY});};
  c.ontouchend=e=>{e.preventDefault();sigEnd();};
}
function sigPos(e){
  const r=e.target.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function sigStart(e){sigDrawing=true;sigHasInk=true;const p=sigPos(e);sigLastX=p.x;sigLastY=p.y;}
function sigMove(e){if(!sigDrawing)return;const p=sigPos(e);
  sigCtx.beginPath();sigCtx.moveTo(sigLastX,sigLastY);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();
  sigLastX=p.x;sigLastY=p.y;}
function sigEnd(){sigDrawing=false;}
function clearSig(){
  const c=document.getElementById('sig-canvas');if(!c)return;
  const rect=c.getBoundingClientRect();
  sigCtx.clearRect(0,0,rect.width,rect.height);sigHasInk=false;S.sigDataUrl='';
}
function saveSig(){
  if(!sigHasInk){toast(L==='zh'?'请先签字':'Please sign first');return;}
  const c=document.getElementById('sig-canvas');if(!c)return;
  S.sigDataUrl=c.toDataURL('image/png');
  document.getElementById('sig-status').style.display='block';
  document.getElementById('sig-btn').textContent='✏️ '+(L==='zh'?'修改签字':'Edit Signature');
  closeModal();toast(L==='zh'?'签字已保存':'Signature saved');
}

function doSubmit(){
  const date=$('#rq-date').value,time=$('#rq-time').value,pax=parseInt($('#rq-pax').value)||1;
  const purpose=$('#rq-purpose').value.trim(),purposeEn=$('#rq-purposeEn').value.trim();

  const approved=$('#rq-approved').value;
  if(!date)return toast(L==='zh'?'请选择日期':'Date required');
  if(!purpose)return toast(L==='zh'?'请填写中文外出事由':'Chinese purpose required');
  if(!purposeEn)return toast(L==='zh'?'请填写英文外出事由':'English purpose required');
  if(!approved)return toast(L==='zh'?'请选择是否经部门负责人许可':'Please select approval status');
  if(approved==='yes'&&!S.sigDataUrl)return toast(L==='zh'?'已许可时需签字':'Signature required when approved');

  if(S.editingId){
    const reqs=DB.requests.get();const r=reqs.find(x=>x.id===S.editingId);
    if(!r||r.status!=='pending')return toast(T('common.cantEdit'));
    Object.assign(r,{date,timeSlot:time,passengers:pax,purpose,purposeEn,notes:notes||'',notesEn:notesEn||'',approved,signature:S.sigDataUrl});
    DB.requests.set(reqs);S.editingId=null;toast(T('common.updated'));
  }else{
    const reqs=DB.requests.get();
    reqs.push({id:uid(),date,timeSlot:time,passengers:pax,purpose,purposeEn,notes:notes||'',notesEn:notesEn||'',approved,signature:S.sigDataUrl,department:S.user.department,submitter:S.user.name,status:'pending',mergedToDispatchId:null,createdAt:now()});
    DB.requests.set(reqs);toast(T('common.reqSubmitted'));
  }
  renderMyReqs();
  $('#rq-purpose').value='';$('#rq-purposeEn').value='';$('#rq-notes').value='';$('#rq-notesEn').value='';$('#rq-pax').value='1';
  $('#rq-approved').value='';S.sigDataUrl='';S.approved='';
  const sb=document.getElementById('sig-status');if(sb)sb.style.display='none';
  const sbtn=document.getElementById('sig-btn');if(sbtn)sbtn.textContent=T('submit.signBtn');
}

function renderMyReqs(){
  const el=$('#my-reqs');if(!el)return;
  let reqs;
  if(isAdmin())reqs=DB.requests.get().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  else reqs=DB.requests.get().filter(r=>r.department===S.user.department).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(!reqs.length){el.innerHTML='<div class="empty"><p>'+T('submit.noreqs')+'</p></div>';return;}
  el.innerHTML=reqs.slice(0,30).map(r=>{

    return `<div class="rr" style="pointer-events:auto;cursor:default;">

          ${canDel?`<button class="ed-b" style="color:var(--danger);" onclick="delMyReq('${r.id}')">🗑️</button>`:''}

      </div></div>`;

}
function editMyReq(id){

function delMyReq(id){if(!isAdmin())return;if(!confirm(T('common.delConfirm')))return;

function buildDCard(dd){
  const reqs=DB.requests.get().filter(r=>dd.requestIds.includes(r.id));
  const pax=reqs.reduce((s,r)=>s+r.passengers,0);
  const depts=[...new Set(reqs.map(r=>deptName(r.department)))].join('、');
  const purposes=L==='zh'?[...new Set(reqs.map(r=>r.purpose))].join('；'):[...new Set(reqs.map(r=>r.purposeEn||r.purpose))].join('; ');
  const purposes2=L==='en'?[...new Set(reqs.map(r=>r.purpose))].join('; '):'';
  const names=reqs.map(r=>r.submitter+'（'+deptName(r.department)+'）').join('、');
  const sigImg=dd.signature?`<img src="${dd.signature}" style="max-width:120px;max-height:50px;border:1px solid var(--border);border-radius:4px;background:rgba(255,255,255,.5);">`:'—';
  return `<div class="dc">
    <div class="dc-hd"><div><h4>${T('dispatch.title')}</h4><div style="font-size:.78em;opacity:.65;">${fmtDateLoc(dd.date)} · ${dd.departureTime||'TBD'}</div></div>

      <div class="dc-row"><span class="dc-l">${T('dispatch.point')}</span><span class="dc-v">${dd.meetingPoint||'—'}</span></div>
      <div class="dc-row"><span class="dc-l">${T('dispatch.pax')}</span><span class="dc-v">${pax} ${T('pool.people')}</span></div>
      <div class="dc-row"><span class="dc-l">${T('dispatch.dept')}</span><span class="dc-v">${depts}</span></div>
      <div class="dc-row"><span class="dc-l">${T('dispatch.purpose')}</span><span class="dc-v">${purposes}${purposes2?' <small>'+purposes2+'</small>':''}</span></div>
      <div class="dc-row"><span class="dc-l">${T('dispatch.passengers')}</span><span class="dc-v">${names}</span></div>
      ${sigImg!=='—'?`<div class="dc-row"><span class="dc-l">${T('dispatch.signed')}</span><span class="dc-v">${sigImg}</span></div>`:''}

function exportImage(){
  if(!isAdmin())return toast(T('common.noPerm'));
  const _today=today();const dispatches=DB.dispatches.get().filter(d=>d.date===_today);
  if(!dispatches.length)return toast(T('dispatch.none'));
  const canvas=$('#export-canvas');canvas.style.display='block';
  canvas.width=420;canvas.height=Math.max(120+dispatches.length*170,200);
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0f172a';ctx.font='bold 20px -apple-system,sans-serif';ctx.textAlign='center';
  ctx.fillText('KMC Vehicle Dispatch',210,38);
  ctx.fillStyle='#64748b';ctx.font='13px -apple-system,sans-serif';
  ctx.fillText(fmtDateLoc(_today)+' · '+fmtD(_today),210,58);
  ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(20,70);ctx.lineTo(400,70);ctx.stroke();
  let y=90;
  dispatches.forEach(dd=>{
    const reqs=DB.requests.get().filter(r=>dd.requestIds.includes(r.id));
    const pax=reqs.reduce((s,r)=>s+r.passengers,0);
    const purposes=[...new Set(reqs.map(r=>r.purpose+' / '+r.purposeEn))].join('; ');
    const depts=[...new Set(reqs.map(r=>r.department))].join(', ');
    ctx.fillStyle='#f8fafc';rrect(ctx,10,y,400,150,10);ctx.fill();
    ctx.strokeStyle='#d1d5db';rrect(ctx,10,y,400,150,10);ctx.stroke();
    ctx.fillStyle='#2563eb';ctx.font='bold 28px -apple-system,sans-serif';ctx.textAlign='right';ctx.fillText(dd.vehicle,395,y+38);
    ctx.fillStyle='#1e293b';ctx.font='bold 15px -apple-system,sans-serif';ctx.textAlign='left';
    ctx.fillText('Driver: '+dd.driver+'   Depart: '+(dd.departureTime||'TBD'),22,y+26);
    ctx.fillStyle='#334155';ctx.font='13px -apple-system,sans-serif';
    ctx.fillText('Point: '+(dd.meetingPoint||'—')+'   Pax: '+pax+'   Dept: '+depts,22,y+52);
    ctx.fillText('Purpose: '+purposes,22,y+76);
    if(dd.notes){ctx.fillStyle='#64748b';ctx.font='12px -apple-system,sans-serif';ctx.fillText('Notes: '+dd.notes,22,y+98);}
    y+=165;
  });
  ctx.fillStyle='#94a3b8';ctx.font='10px -apple-system,sans-serif';ctx.textAlign='center';
  ctx.fillText('Dispatcher: '+S.user.name+' · KMC Dispatcher',210,y+16);
  canvas.toBlob(b=>{
    const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;
    a.download='KMC_Dispatch_'+_today+'.png';a.click();URL.revokeObjectURL(u);toast(T('common.exported'));
  },'image/png');canvas.style.display='none';
}
function exportCSV(){
  if(!isAdmin())return toast(T('common.noPerm'));
  const dd=DB.dispatches.get();const rr=DB.requests.get();
  let csv='\uFEFFDate,Vehicle,Driver,Departure,Meeting Point,Pax,Department,Purpose(CN),Purpose(EN),Passengers,Notes\n';
  dd.forEach(d=>{
    const rl=rr.filter(r=>d.requestIds.includes(r.id));

    csv+=`${d.date},${d.vehicle},${d.driver},${d.departureTime||''},${d.meetingPoint||''},${pax},${[...new Set(rl.map(r=>r.department))].join('/')},"${[...new Set(rl.map(r=>r.purpose))].join('; ')}","${[...new Set(rl.map(r=>r.purposeEn||''))].join('; ')}","${rl.map(r=>r.submitter+'('+r.department+')').join('/')}","${d.notes||''}"\n`;

function confirmDisp(){
  const v=$('#md-v').value,d=$('#md-d').value,t2=$('#md-t').value.trim(),p=$('#md-p').value.trim(),n=$('#md-nt').value.trim();
  if(!v||!d)return toast('Vehicle & driver required');
  const rIds=[...S.selReqs];const firstR=DB.requests.get().find(r=>r.id===rIds[0]);
  const did=uid();const ds=DB.dispatches.get();
  ds.push({id:did,date:firstR.date,vehicle:v,driver:d,departureTime:t2||null,meetingPoint:p||null,notes:n||'',notesEn:'',signature:'',requestIds:rIds,createdAt:now()});

function editDisp(did){

function cancelDisp(did){
  if(!confirm(T('pool.cancelConfirm')))return;

function renderRecords(){
  if(!isAdmin())return;
  const pg=$('#pg-records');
  const ds=DB.dispatches.get().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));
  const rs=DB.requests.get();const vs=DB.vehicles.get().map(v=>v.plate);
  const ad=new Set();rs.forEach(r=>ad.add(r.department));
  if(!ds.length){pg.innerHTML='<div class="empty"><p>'+T('records.noMatch')+'</p></div>';return;}

  let html=`<div class="stats"><div class="st"><div class="st-n">${ds.length}</div><div class="st-l">${T('records.totalTrips')}</div></div>`;
  const vc={};vs.forEach(v=>vc[v]=0);ds.forEach(d=>{if(vc[d.vehicle]!==undefined)vc[d.vehicle]++;});
  const top=Object.entries(vc).sort((a,b)=>b[1]-a[1])[0];
  if(top)html+=`<div class="st"><div class="st-n">${top[0]}</div><div class="st-l">${T('records.mostUsed')}</div></div>`;
  html+=`</div>`;

  html+=`<div class="ftb">
    <input type="date" id="ft-from" placeholder="From" onchange="renderRecords()" style="font-size:.85em;">
    <input type="date" id="ft-to" placeholder="To" onchange="renderRecords()" style="font-size:.85em;">
    <select id="ft-veh" onchange="renderRecords()"><option value="">${T('records.allVeh')}</option>${vs.map(v=>'<option>'+v+'</option>').join('')}</select>
    <select id="ft-dept" onchange="renderRecords()"><option value="">${T('records.allDept')}</option>${[...ad].map(d=>'<option>'+d+'</option>').join('')}</select>
    <div class="sp"></div>
    <button class="btn btn-o btn-sm" onclick="exportCSV()">📥 CSV</button>
  </div>`;

  let fd=ds;
  const ff=$('#ft-from')?.value,ft=$('#ft-to')?.value,vf=$('#ft-veh')?.value,df=$('#ft-dept')?.value;
  if(ff)fd=fd.filter(d=>d.date>=ff);if(ft)fd=fd.filter(d=>d.date<=ft);
  if(vf)fd=fd.filter(d=>d.vehicle===vf);
  if(df)fd=fd.filter(d=>{const rl=rs.filter(r=>d.requestIds.includes(r.id));return rl.some(r=>r.department===df);});
  if(!fd.length){html+='<div class="empty"><p>'+T('records.noMatch')+'</p></div>';}
  else{
    html+=fd.map(d=>{
      const rl=rs.filter(r=>d.requestIds.includes(r.id));
      const pax=rl.reduce((s,r)=>s+r.passengers,0);
      const depts=[...new Set(rl.map(r=>r.department))].join('、');
      const purposes=[...new Set(rl.map(r=>r.purpose))].join('；');
      const purposesEn=[...new Set(rl.map(r=>r.purposeEn||''))].join('; ');
      return `<div class="card"><div class="card-bd">
        <div class="card-h"><h3>📅 ${fmtDateLoc(d.date)} · 🚗 ${d.vehicle} · 👤 ${d.driver}</h3>
          <button class="btn btn-o btn-sm" onclick="editDisp('${d.id}')">✏️ ${T('records.edit')}</button></div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:.88em;color:var(--text2);margin-bottom:4px;">
          <span>${T('dispatch.time2')}: ${d.departureTime||'—'}</span><span>${T('dispatch.point')}: ${d.meetingPoint||'—'}</span><span>${pax}pax</span><span>${depts}</span></div>
        <div style="font-size:.95em;">${purposes}</div>
        ${purposesEn?`<div style="font-size:.88em;color:var(--text3);">${purposesEn}</div>`:''}
        ${d.notes?`<div style="font-size:.85em;color:var(--text3);margin-top:3px;">💬 ${d.notes}</div>`:''}
      </div></div>`;
    }).join('');
  }
  pg.innerHTML=html;
}

// ================ SETTINGS ================
function renderSettings(){
  const pg=$('#pg-settings');
  const vs=DB.vehicles.get(),ds=DB.drivers.get(),us=DB.users.get(),inv=DB.invite.get();
  let html='';

  if(isAdmin()){
    html+=`<div class="card"><div class="card-bd">
      <div class="card-h"><h3>🔑 ${T('settings.invite')}</h3></div>
      <div class="fg"><input type="text" id="st-invite" value="${inv}"></div>
      <button class="btn btn-p btn-sm" onclick="saveInvite()">${T('settings.save')}</button></div></div>`;

    html+=`<div class="card"><div class="card-bd">
      <div class="card-h"><h3>🚗 ${T('settings.vehicles')} (${vs.length})</h3></div>
      ${vs.map((v,i)=>`<div class="sr"><div class="sr-i"><div class="sr-l">${v.plate}</div><div class="sr-s">${L==='zh'?v.type:v.typeEn} · ${v.seats} ${T('settings.seats')}</div></div>
        <div class="sr-a"><button class="btn btn-o btn-sm" onclick="editVeh(${i})">✏️</button><button class="btn btn-sm btn-d" onclick="delVeh(${i})">🗑️</button></div></div>`).join('')}
      <div class="si">
        <input id="nv-plate" placeholder="${T('settings.plate')}"><input id="nv-type" placeholder="${T('settings.vehType')} (CN)">
        <input id="nv-typeEn" placeholder="${T('settings.vehType')} (EN)"><input id="nv-seats" type="number" value="5" style="width:55px;">
        <button class="btn btn-p btn-sm" onclick="addVeh()">+ ${T('settings.add')}</button></div></div></div>`;

    html+=`<div class="card"><div class="card-bd">
      <div class="card-h"><h3>👤 ${T('settings.drivers')} (${ds.length})</h3></div>
      ${ds.map((d,i)=>`<div class="sr"><div class="sr-i"><div class="sr-l">${d.name}</div></div>
        <div class="sr-a"><button class="btn btn-o btn-sm" onclick="editDrv(${i})">✏️</button><button class="btn btn-sm btn-d" onclick="delDrv(${i})">🗑️</button></div></div>`).join('')}
      <div class="si"><input id="nd-name" placeholder="${T('settings.drvName')}"><button class="btn btn-p btn-sm" onclick="addDrv()">+ ${T('settings.add')}</button></div></div></div>`;

    html+=`<div class="card"><div class="card-bd">
      <div class="card-h"><h3>👥 ${T('settings.users')} (${us.length})</h3></div>
      ${us.length?us.map((u,i)=>`<div class="sr"><div class="sr-i"><div class="sr-l">${u.name} ${u.role==='admin'?'<span style="color:var(--primary);font-size:.78em;">[ADMIN]</span>':''}</div><div class="sr-s">${deptName(u.department)} · ${u.lastLogin?fmtDateLoc(u.lastLogin.slice(0,10)):''}</div></div>
        <div class="sr-a"><button class="btn btn-o btn-sm" onclick="editUser(${i})">✏️</button><button class="btn btn-sm btn-d" onclick="delUser(${i})">🗑️</button></div></div>`).join(''):'<div class="empty" style="padding:20px;"><p>'+T('settings.noUsers')+'</p></div>'}
    </div></div>`;
  }

  html+=`<div class="card"><div class="card-bd">
    <div class="card-h"><h3>💾 ${T('settings.backup')}</h3></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn btn-o btn-sm" onclick="expData()">📥 ${T('settings.exportJson')}</button>
      ${isAdmin()?`<button class="btn btn-o btn-sm" onclick="$('#ifile').click()">📤 ${T('settings.importJson')}</button>
      <input type="file" id="ifile" accept=".json" onchange="impData(this)" style="display:none;">
      <button class="btn btn-sm btn-d" onclick="wipeData()">⚠️ ${T('settings.clear')}</button>`:''}</div>
    <p style="font-size:.78em;color:var(--text3);margin-top:6px;">${T('settings.backupHint')}</p></div></div>`;

  html+=`<div style="text-align:center;margin-top:16px;"><button class="btn btn-gh" onclick="doLogout()">${T('settings.logout')}</button></div>`;
  pg.innerHTML=html;
}

function saveInvite(){const v=$('#st-invite')?.value.trim();if(v){DB.invite.set(v);toast(T('common.inviteUpdated'));}}
function addVeh(){
  const p=$('#nv-plate').value.trim(),t=$('#nv-type').value.trim(),te=$('#nv-typeEn').value.trim(),s=parseInt($('#nv-seats').value)||5;
  if(!p||!t)return toast('Plate and type required');
  const vs=DB.vehicles.get();vs.push({plate:p,type:t,typeEn:te||t,seats:s});DB.vehicles.set(vs);toast(T('common.success'));renderSettings();
}
function editVeh(i){const v=DB.vehicles.get()[i];
  showModal(`<h3>${T('settings.edit')} ${T('settings.vehicles')}</h3>
    <div class="fg"><label>${T('settings.plate')}</label><input id="ev-p" value="${v.plate}"></div>
    <div class="fg"><label>${T('settings.vehType')} (CN)</label><input id="ev-t" value="${v.type}"></div>
    <div class="fg"><label>${T('settings.vehType')} (EN)</label><input id="ev-te" value="${v.typeEn||''}"></div>
    <div class="fg"><label>${T('settings.seats')}</label><input id="ev-s" type="number" value="${v.seats}"></div>
    <div style="text-align:right;display:flex;gap:6px;justify-content:flex-end;">
      <button class="btn btn-o" onclick="closeModal()">${T('common.cancel')}</button>
      <button class="btn btn-p" onclick="saveVeh(${i})">${T('common.save')}</button></div>`,true);
}
function saveVeh(i){const vs=DB.vehicles.get();vs[i].plate=$('#ev-p').value.trim();vs[i].type=$('#ev-t').value.trim();
  vs[i].typeEn=$('#ev-te').value.trim()||vs[i].type;vs[i].seats=parseInt($('#ev-s').value)||5;
  DB.vehicles.set(vs);closeModal();toast(T('common.updated'));renderSettings();}
function delVeh(i){if(!confirm(T('common.delConfirm')))return;const vs=DB.vehicles.get();vs.splice(i,1);DB.vehicles.set(vs);toast(T('common.deleted'));renderSettings();}
function addDrv(){const n=$('#nd-name').value.trim();if(!n)return toast('Name required');const ds=DB.drivers.get();ds.push({name:n});DB.drivers.set(ds);toast(T('common.success'));renderSettings();}
function editDrv(i){const d=DB.drivers.get()[i];
  showModal(`<h3>${T('settings.edit')} ${T('settings.drivers')}</h3>
    <div class="fg"><label>${T('settings.drvName')}</label><input id="ed-n" value="${d.name}"></div>
    <div style="text-align:right;display:flex;gap:6px;justify-content:flex-end;">
      <button class="btn btn-o" onclick="closeModal()">${T('common.cancel')}</button>
      <button class="btn btn-p" onclick="saveDrv(${i})">${T('common.save')}</button></div>`,true);
}
function saveDrv(i){const ds=DB.drivers.get();ds[i].name=$('#ed-n').value.trim();DB.drivers.set(ds);closeModal();toast(T('common.updated'));renderSettings();}
function delDrv(i){if(!confirm(T('common.delConfirm')))return;const ds=DB.drivers.get();ds.splice(i,1);DB.drivers.set(ds);toast(T('common.deleted'));renderSettings();}

function editUser(i){const u=DB.users.get()[i];
  showModal(`<h3>${T('settings.edit')} ${T('settings.users')}</h3>
    <div class="fg"><label>${T('settings.userName')}</label><input id="eu-n" value="${u.name}"></div>
    <div class="fg"><label>${T('settings.userDept')}</label><select id="eu-d">${DEPTS.map(d=>'<option value="'+d.cn+'" '+(d.cn===u.department?'selected':'')+'>'+d.cn+' / '+d.en+'</option>').join('')}</select></div>
    <div style="text-align:right;display:flex;gap:6px;justify-content:flex-end;">
      <button class="btn btn-o" onclick="closeModal()">${T('common.cancel')}</button>
      <button class="btn btn-p" onclick="saveUser(${i})">${T('common.save')}</button></div>`,true);
}
function saveUser(i){const us=DB.users.get();const old=us[i];const oldName=old.name,oldDept=old.department;
  us[i].name=$('#eu-n').value.trim();us[i].department=$('#eu-d').value;DB.users.set(us);
  const rs=DB.requests.get();
  rs.forEach(r=>{if(r.submitter===oldName&&r.department===oldDept){r.submitter=us[i].name;r.department=us[i].department;}});
  DB.requests.set(rs);closeModal();toast(T('common.updated'));renderSettings();}
function delUser(i){if(!confirm(T('common.delConfirm')))return;const us=DB.users.get();us.splice(i,1);DB.users.set(us);toast(T('common.deleted'));renderSettings();}

function expData(){const data={vehicles:DB.vehicles.get(),drivers:DB.drivers.get(),requests:DB.requests.get(),dispatches:DB.dispatches.get(),users:DB.users.get(),invite:DB.invite.get(),exportedAt:now()};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='KMC_Data_'+today()+'.json';a.click();URL.revokeObjectURL(u);toast(T('common.exported'));}
function impData(inp){if(!isAdmin())return toast(T('common.noPerm'));
  const f=inp.files[0];if(!f)return;if(!confirm(T('common.importWarn'))){inp.value='';return;}
  const r=new FileReader();r.onload=e=>{
    try{const d=JSON.parse(e.target.result);if(d.vehicles)DB.vehicles.set(d.vehicles);if(d.drivers)DB.drivers.set(d.drivers);if(d.requests)DB.requests.set(d.requests);if(d.dispatches)DB.dispatches.set(d.dispatches);if(d.users)DB.users.set(d.users);if(d.invite)DB.invite.set(d.invite);toast(T('common.success'));renderSettings();}catch{toast('Invalid file');}
  };r.readAsText(f);inp.value='';}
function wipeData(){if(!isAdmin())return toast(T('common.noPerm'));
  if(!confirm(T('common.clearWarn')))return;if(!confirm(T('common.clearWarn2')))return;
  ['vehicles','drivers','requests','dispatches','users','imported'].forEach(k=>LS(k).set(k==='imported'?true:[]));
  DB.init();toast(T('common.deleted'));renderSettings();}
</script>
</body>
</html>
